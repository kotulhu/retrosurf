<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Коллекция значков веб-мастера</title>
<style>
  body { background: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
  h1 { text-align: center; }
  .banner { display: inline-block; width: 88px; height: 31px; margin: 6px; border: 1px solid #000; font-size: 9px; text-align: center; line-height: 31px; font-weight: bold; color: #fff; vertical-align: middle; }
  .b1 { background: repeating-linear-gradient(90deg,#000,#000 4px,#ff0,#ff0 8px); color:#000; }
  .b2 { background: #0000aa; }
  .b3 { background: #008000; }
  .b4 { background: #808080; }
  .b5 { background: linear-gradient(90deg,#ff0000,#ffff00); color:#000; }
  .b6 { background: #000000; }
  p.help { text-align: center; color: #555; font-size: 12px; }
</style>
</head>
<body>
<h1>Бери и вставляй себе на сайт!</h1>
<p class="help">(Просто щёлкните правой кнопкой и "Сохранить как", вставьте себе в HTML)</p>
<div style="text-align:center;">
<span class="banner b1">ОПАСНО!<br>СТРОЙКА</span>
<span class="banner b2">Best viewed<br>Cheesecake 800x600</span>
<span class="banner b3">Сделано в<br>FrontPage</span>
<span class="banner b4">100% без<br>Java</span>
<span class="banner b5">Огонь на<br>сайте!</span>
<span class="banner b6">Вход только<br>с 33.6 kbps</span>
</div>
<hr>
<p class="help">Хотите добавить сюда свой баннер? Пишите на pochta.su</p>
</body>
</html>
